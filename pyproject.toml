[project]
name = "obot-acm"
version = "5.0.0"
description = "Source code of the qqbot OBot's ACM."
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "av>=18.1.0",
    "botpy",
    "easy-pixie>=0.0.10",
    "easyocr>=1.7.2",
    "gitpython>=3.2.1",
    "imgkit>=1.2.3",
    "lxml>=6.1.3",
    "markdown2>=2.5.5",
    "pilk>=0.2.4",
    "pixie-python>=4.3.0",
    "psutil>=7.2.2",
    "pypinyin>=0.55.0",
    "python-dateutil>=3.0.0",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "thefuzz>=0.22.1",
]

[tool.uv.sources]
botpy = { git = "https://github.com/Floating-Ocean/botpy.git", rev = "599c516afcf2e15fadc22cdde6f3696c22dd4de7" }
